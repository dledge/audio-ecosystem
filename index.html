    <style>
        /* Audio skin: block party, 1986. The map is a brick wall at night,
           companies are spray-paint dots, regions are tagged in block
           letters. The controls are a boombox; a company's card is a
           cassette label written by hand; zoom is the tape-deck keys. */
        :root {
            --wall: #1c1a19;
            --chalk: #f3eee4;
            --chalk-dim: #b9b1a4;
            --magenta: #ff3d8b;
            --yellow: #ffd23f;
            --cyan: #2de2e6;
            --paper: #f2e8d0;
            --ink: #1f1c1a;
            --ink-soft: #5c544b;
            --plastic: #232428;
            --plastic-hi: #34363c;
            --chrome-a: #e9ebee;
            --chrome-b: #9aa0a8;
            --lcd: #0f1a14;
            --lcd-text: #9ff5c9;
            --tag: "Sedgwick Ave Display", "Permanent Marker", cursive;
            --block: "Bungee", "Impact", sans-serif;
            --hand: "Permanent Marker", "Marker Felt", cursive;
            --cond: "Barlow Condensed", "Arial Narrow", sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--wall); font-family: var(--cond); font-weight: 400; overflow: hidden; color: var(--chalk); }

        #canvas-container { width: 100vw; height: 100vh; position: relative; cursor: grab; }
        #canvas-container:active { cursor: grabbing; }
        canvas { display: block; }

        /* ---------- The boombox (controls) ---------- */
        #controls {
            position: absolute;
            top: 46px;
            left: 22px;
            z-index: 50;
            width: min(318px, calc(100vw - 44px));
            padding: 14px 16px 14px;
            border-radius: 14px;
            background:
                linear-gradient(180deg, var(--plastic-hi) 0%, var(--plastic) 38%, #1b1c1f 100%);
            border: 1px solid #44464d;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.10),
                inset 0 -3px 0 rgba(0, 0, 0, 0.35),
                0 22px 50px rgba(0, 0, 0, 0.6);
        }
        /* Carry handle */
        #controls::before {
            content: "";
            position: absolute;
            left: 50%; top: -26px;
            width: 62%; height: 30px;
            transform: translateX(-50%);
            border: 5px solid var(--chrome-b);
            border-bottom: none;
            border-radius: 14px 14px 0 0;
            box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.35);
        }
        .boombox-top {
            display: grid;
            grid-template-columns: 74px 1fr 74px;
            gap: 10px;
            align-items: center;
            margin-bottom: 12px;
        }
        /* Speaker cones: surround, cone, dust cap */
        .speaker {
            width: 74px; height: 74px;
            border-radius: 50%;
            background:
                radial-gradient(circle, #c9ccd1 0 9%, #3a3c42 10% 14%, transparent 15%),
                repeating-radial-gradient(circle, #15161a 0 2px, #202227 2px 4px),
                #15161a;
            border: 4px solid var(--chrome-b);
            box-shadow: inset 0 0 0 3px #0b0b0d, 0 2px 0 rgba(255, 255, 255, 0.08);
        }
        @media (prefers-reduced-motion: no-preference) {
            .speaker.thump { animation: thump 0.46s ease-out; }
        }
        @keyframes thump { 30% { transform: scale(1.045); } }
        /* Cassette window with the name tagged on it */
        .deck {
            min-width: 0;
            height: 74px;
            border-radius: 6px;
            background: linear-gradient(180deg, #121316, #1a1b1f);
            border: 2px solid #0b0b0d;
            box-shadow: inset 0 0 0 1px #3a3c42;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            overflow: hidden;
            text-align: center;
        }
        #controls h1 {
            font-family: var(--tag);
            font-weight: 400;
            font-size: 21px;
            line-height: 1.0;
            padding: 0 6px;
            color: var(--yellow);
            text-shadow: 2px 2px 0 var(--magenta), 0 0 14px rgba(255, 210, 63, 0.25);
            transform: rotate(-4deg);
        }
        #controls .sub {
            font-size: 14px;
            color: var(--chalk-dim);
            margin-bottom: 10px;
            line-height: 1.25;
        }

        /* Search as the LCD strip */
        #search {
            width: 100%;
            padding: 7px 10px 6px;
            border: 1px solid #0b0b0d;
            border-radius: 4px;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.6);
            font: 500 16px var(--cond);
            letter-spacing: 0.04em;
            outline: none;
            background: var(--lcd);
            color: var(--lcd-text);
        }
        #search:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
        .search-wrap { position: relative; }
        /* Tag suggestions: an LCD drop-down under the search strip */
        #tag-suggest {
            position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 60;
            margin: 0; padding: 4px 0; list-style: none;
            background: var(--lcd); border: 1px solid #0b0b0d; border-radius: 4px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.55);
            max-height: 320px; overflow-y: auto;
        }
        #tag-suggest[hidden] { display: none; }
        #tag-suggest li { padding: 6px 10px; cursor: pointer; color: var(--lcd-text); }
        #tag-suggest li .t { font: 500 15px var(--cond); letter-spacing: 0.03em; }
        #tag-suggest li .t mark { background: none; color: var(--yellow); }
        #tag-suggest li .n { float: right; color: rgba(159, 245, 201, 0.6); font-variant-numeric: tabular-nums; }
        #tag-suggest li .d { display: block; font-size: 12.5px; color: rgba(159, 245, 201, 0.6); line-height: 1.3; margin-top: 1px; }
        #tag-suggest li[aria-selected="true"] { background: rgba(159, 245, 201, 0.12); }
        #tag-suggest .head { padding: 4px 10px 2px; font-size: 12px; color: rgba(159, 245, 201, 0.5); cursor: default; }
        #tag-chip {
            display: flex; align-items: center; gap: 8px; margin-top: 8px;
            padding: 4px 6px 4px 10px; border-radius: 4px;
            background: rgba(255, 210, 63, 0.12); border: 1px solid rgba(255, 210, 63, 0.45);
            color: var(--chalk); font-size: 14px;
        }
        #tag-chip[hidden] { display: none; }
        #tag-chip .label { flex: 1; }
        #tag-chip .label b { color: var(--yellow); font-weight: 600; }
        #tag-chip button {
            border: none; background: none; color: var(--chalk); font-size: 18px; line-height: 1;
            cursor: pointer; padding: 0 4px; border-radius: 3px;
        }
        #tag-chip button:focus-visible { outline: 2px solid var(--cyan); }
        #search::placeholder { color: rgba(159, 245, 201, 0.45); }

        #filters { margin-top: 12px; font-size: 14.5px; color: var(--chalk-dim); }
        #filters label { display: flex; justify-content: space-between; margin-bottom: 2px; }
        #filters label .val { color: var(--yellow); font-weight: 600; font-variant-numeric: tabular-nums; }

        /* Sliders as graphic-EQ faders: a level meter track, a chrome cap */
        #filters input[type=range] {
            -webkit-appearance: none; appearance: none;
            width: 100%; height: 22px; margin: 0 0 8px;
            background: transparent; cursor: pointer;
        }
        #filters input[type=range]::-webkit-slider-runnable-track {
            height: 6px; border-radius: 3px;
            background:
                repeating-linear-gradient(90deg, transparent 0 7px, #121316 7px 9px),
                linear-gradient(90deg, var(--cyan), var(--yellow) 60%, var(--magenta));
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.6);
        }
        #filters input[type=range]::-moz-range-track {
            height: 6px; border-radius: 3px;
            background: linear-gradient(90deg, var(--cyan), var(--yellow) 60%, var(--magenta));
        }
        #filters input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px; height: 22px; margin-top: -8px;
            border-radius: 2px;
            border: 1px solid #0b0b0d;
            background: linear-gradient(90deg, var(--chrome-b), var(--chrome-a) 45%, #6d727a 50%, var(--chrome-a) 55%, var(--chrome-b));
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.6);
        }
        #filters input[type=range]::-moz-range-thumb {
            width: 14px; height: 22px; border-radius: 2px; border: 1px solid #0b0b0d;
            background: linear-gradient(90deg, var(--chrome-b), var(--chrome-a) 45%, #6d727a 50%, var(--chrome-a) 55%, var(--chrome-b));
        }
        #filters input[type=range]:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
        /* Counts read like the tape counter */
        #filters .check { display: flex; justify-content: flex-start; align-items: center; gap: 8px; margin: 8px 0 4px; cursor: pointer; }
        #filters .check[hidden] { display: none; }
        #filters .check input { accent-color: var(--yellow); margin: 0; }
        #filters .check input:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
        #filters .ring { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--yellow); flex: none; }
        #filter-count { margin-top: 2px; font-size: 15px; color: var(--chalk); font-weight: 500; font-variant-numeric: tabular-nums; }

        /* ---------- Cassette labels (tooltip, deep panel) ---------- */
        .jcard {
            background:
                linear-gradient(180deg, #e8372f 0 4px, #ff7a2f 4px 8px, var(--yellow) 8px 12px, transparent 12px),
                var(--paper);
            color: var(--ink);
            border-radius: 4px;
            box-shadow: 0 14px 34px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(0, 0, 0, 0.25);
        }
        #tooltip {
            display: none;
            position: absolute;
            padding: 20px 16px 13px;
            max-width: 350px;
            pointer-events: none;
            z-index: 100;
            font-size: 15px;
            line-height: 1.35;
            transform: rotate(-0.6deg);
        }
        #tooltip .name { font-family: var(--hand); font-size: 21px; line-height: 1.1; color: var(--ink); margin-bottom: 4px; }
        #tooltip .meta { color: var(--ink-soft); font-size: 13.5px; margin-bottom: 7px; font-variant-numeric: tabular-nums; }
        #tooltip .tags { color: #b0145a; font-size: 13.5px; font-weight: 600; margin-bottom: 7px; }
        #tooltip .desc { color: var(--ink); }

        #deep-panel {
            display: none;
            position: absolute;
            padding: 22px 22px 16px;
            width: 430px;
            max-width: calc(100vw - 24px);
            max-height: 95vh;
            overflow-y: auto;
            pointer-events: none;
            z-index: 99;
            font-size: 15px;
            line-height: 1.4;
            opacity: 0;
            transition: opacity 180ms ease;
            /* Ruled label lines under the writing */
            background:
                linear-gradient(180deg, #e8372f 0 4px, #ff7a2f 4px 8px, var(--yellow) 8px 12px, transparent 12px),
                repeating-linear-gradient(180deg, transparent 0 20px, rgba(31, 28, 26, 0.10) 20px 21px),
                var(--paper);
        }
        #deep-panel.visible { opacity: 1; }
        #deep-panel .title { font-family: var(--hand); font-size: 28px; color: var(--ink); margin-bottom: 10px; line-height: 1.05; }
        #deep-panel ul { list-style: none; }
        #deep-panel ul li { margin-bottom: 7px; padding-left: 20px; position: relative; color: var(--ink); }
        /* A little tape reel instead of a bullet dot */
        #deep-panel ul li::before {
            content: "";
            position: absolute;
            left: 2px; top: 0.42em;
            width: 10px; height: 10px;
            border-radius: 50%;
            border: 2px solid var(--ink);
            background: radial-gradient(circle, var(--ink) 0 2px, transparent 2.5px);
        }
        #deep-panel .cursor {
            display: inline-block;
            width: 7px;
            background: var(--magenta);
            margin-left: 1px;
            animation: blink 0.9s steps(1) infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        #connector { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 98; }

        /* ---------- Tape-deck keys (zoom) ---------- */
        #zoom-controls {
            position: absolute;
            bottom: 22px;
            right: 22px;
            z-index: 50;
            display: flex;
            gap: 4px;
            padding: 6px;
            border-radius: 8px;
            background: #111215;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 10px 24px rgba(0, 0, 0, 0.55);
        }
        .zoom-btn {
            width: 48px; height: 44px;
            border-radius: 3px 3px 6px 6px;
            border: 1px solid #0b0b0d;
            border-top: 4px solid var(--magenta);
            background: linear-gradient(180deg, var(--chrome-a), var(--chrome-b));
            box-shadow: 0 4px 0 #55595f, 0 6px 8px rgba(0, 0, 0, 0.5);
            font: 700 22px var(--cond);
            color: var(--ink);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: transform 80ms ease, box-shadow 80ms ease;
        }
        #zoom-out { border-top-color: var(--cyan); }
        #zoom-reset { border-top-color: var(--yellow); }
        .zoom-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #55595f, 0 2px 4px rgba(0, 0, 0, 0.5); }
        .zoom-btn:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }

        #last-updated {
            position: absolute;
            bottom: 16px;
            left: 22px;
            z-index: 50;
            font-size: 14px;
            color: var(--chalk-dim);
            pointer-events: none;
        }
    </style>
    <script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "1b875e43e9c9482680d4cf6a3aecfaf7"}'></script>

<body>
    <div id="canvas-container">
        <canvas id="canvas"></canvas>
    </div>

    <div id="controls">
        <div class="boombox-top">
            <div class="speaker" aria-hidden="true"></div>
            <div class="deck"><h1>Audio Ecosystem</h1></div>
            <div class="speaker" aria-hidden="true"></div>
        </div>
        <div class="sub">Who builds sound, clustered by what they do</div>
        <div class="search-wrap">
            <input type="text" id="search" placeholder="Search companies or tags" aria-label="Search companies or tags"
                   role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="tag-suggest" autocomplete="off">
            <ul id="tag-suggest" role="listbox" aria-label="Tags" hidden></ul>
        </div>
        <div id="tag-chip" hidden>
            <span class="label"></span>
            <button type="button" id="tag-clear" aria-label="Clear tag filter">&times;</button>
        </div>
        <div id="filters">
            <label for="mention-slider">Min mentions <span class="val" id="mention-val">2</span></label>
            <input type="range" id="mention-slider" min="1" max="20" value="2">
            <label for="score-slider">Min relevance <span class="val" id="score-val">0.30</span></label>
            <input type="range" id="score-slider" min="0" max="0.95" step="0.05" value="0.3">
            <label class="check" id="research-filter" for="research-only" hidden>
                <input type="checkbox" id="research-only"><span class="ring" aria-hidden="true"></span>
                Research projects only
            </label>
            <div id="filter-count"></div>
        </div>
    </div>

    <div id="tooltip" class="jcard">
        <div class="name"></div>
        <div class="meta"></div>
        <div class="tags"></div>
        <div class="desc"></div>
    </div>

    <svg id="connector">
        <line id="connector-line" x1="0" y1="0" x2="0" y2="0"
              stroke="rgba(255,61,139,0.75)" stroke-width="1.5"
              stroke-dasharray="160" stroke-dashoffset="160" />
    </svg>

    <div id="deep-panel" class="jcard">
        <div class="title"></div>
        <ul></ul>
    </div>

    <div id="zoom-controls">
        <button class="zoom-btn" id="zoom-in" aria-label="Zoom in">+</button>
        <button class="zoom-btn" id="zoom-out" aria-label="Zoom out">&minus;</button>
        <button class="zoom-btn" id="zoom-reset" aria-label="Reset view" style="font-size:17px">&#8962;</button>
    </div>

    <div id="last-updated"></div>

    <script>
    // Rendered by build_visualization.py from the domain's MACRO_CATEGORIES
    // (in order) over a fixed palette, plus 'Other'.
    const CATEGORY_COLORS = {
        "Transducers": "#e63946",
        "Audio Silicon": "#2a9d8f",
        "Transport & Connectivity": "#e9a820",
        "Algorithms & DSP Software": "#3b82f6",
        "Audio AI & ML": "#a855f7",
        "Pro Audio Equipment & Software": "#f97316",
        "Audio End Products": "#64748b",
        "Test, Measurement & Simulation": "#10b981",
        "Standards, Licensing & Data": "#ec4899",
        "Adjacent Acoustic Applications": "#84cc16",
        "Other": "#9ca3af"
};
    const CATEGORY_GLOW = Object.fromEntries(Object.entries(CATEGORY_COLORS).map(([k, hex]) => {
        const n = parseInt(hex.slice(1), 16);
        const a = (k === 'Other' || hex === '#64748b') ? 0.3 : 0.4;
        return [k, `rgba(${n >> 16}, ${(n >> 8) & 255}, ${n & 255}, ${a})`];
    }));

    function getRadius(point, zoom) {
        // Wider range than the old star look so mention count reads directly
        // as dot size: 1 mention ≈ 1.6px, 600+ mentions ≈ 9px at rest zoom.
        const base = Math.max(1.6, Math.min(9, Math.log2(point.mention_count + 1) * 1.6));
        return base * Math.min(zoom, 3);
    }

    let data = null;
    let canvas, ctx;
    let width, height;
    let offsetX = 0, offsetY = 0;
    let targetOffsetX = 0, targetOffsetY = 0;
    const MIN_ZOOM = 1.2;  // also the initial / reset zoom
    const DESC_START = 16; // zoom where descriptions appear under company names

    // A company's description wrapped to a narrow column (max 3 lines), cached
    // per font size. ctx.font must already be set to the description font.
    function descLines(point, size) {
        const key = Math.round(size * 2);
        if (point._descKey === key) return point._desc;
        const maxW = size * 19;
        const words = String(point.description).split(/\s+/);
        const lines = [];
        let cur = '';
        for (const w of words) {
            const next = cur ? cur + ' ' + w : w;
            if (ctx.measureText(next).width > maxW && cur) {
                lines.push(cur);
                cur = w;
                if (lines.length === 3) break;
            } else {
                cur = next;
            }
        }
        if (lines.length < 3 && cur) lines.push(cur);
        else if (lines.length === 3 && cur) lines[2] = lines[2].replace(/[,.;:]?$/, '…');
        point._descKey = key;
        point._desc = lines;
        return lines;
    }
    let zoom = MIN_ZOOM;
    let targetZoom = MIN_ZOOM;
    // Camera-smoothing rate (per second). Frame-rate independent: the actual
    // per-frame factor is derived via 1 - exp(-rate * dt), so 60Hz displays and
    // 120Hz ProMotion panels converge at the same real-time speed.
    // Tuned to match the old 0.02/frame @ 60Hz feel.
    const CAMERA_EASE_RATE = 1.2;
    let lastFrameTime = 0;
    let dragging = false;
    let dragStartX, dragStartY;
    let searchTerm = '';
    let activeTag = null;       // a tag picked from the search suggestions: highlight its companies
    let tagCounts = {};         // {tag: companies on the map carrying it}
    let suggestIdx = -1;
    let hoveredPoint = null;
    let mentionThreshold = 2;
    let scoreThreshold = 0.3;
    let researchOnly = false;   // show only labs' research projects (point.research)

    let minX, maxX, minY, maxY, rangeX, rangeY;

    // D3 force simulation
    let simulation = null;
    let nodes = [];

    // --- Background: a brick wall at night that drifts with the map
    // (parallax), each region sprayed with a faint haze of its own colour,
    // under a screen-fixed vignette. Sound waves (drawWaves) are the moving
    // element; the wall itself is still.
    const GROUND = '#1c1a19';
    const BRICK_W = 34, BRICK_H = 13, MORTAR = 2;   // px at rest
    const SPRAY = ['255, 61, 139', '45, 226, 230', '255, 210, 63'];   // magenta, cyan, yellow
    const REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const FONT_SANS  = '"Barlow Condensed", "Arial Narrow", sans-serif';
    const FONT_SERIF = '"Bungee", "Impact", sans-serif';    // region and background lettering
    let grillePattern = null;
    let vignette = null;

    function resetBackground() {
        // One tile of running-bond brick, 4 courses x 3 bricks, each brick a
        // slightly different tone (fixed seed: the wall never shimmers).
        const dpr = devicePixelRatio || 1;
        const W = BRICK_W * 3, H = BRICK_H * 4;
        const tile = document.createElement('canvas');
        tile.width = Math.round(W * dpr);
        tile.height = Math.round(H * dpr);
        const t = tile.getContext('2d');
        t.scale(tile.width / W, tile.height / H);
        t.fillStyle = '#121110';                        // mortar
        t.fillRect(0, 0, W, H);
        let seed = 7;
        const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
        for (let row = 0; row < 4; row++) {
            const shift = row % 2 ? BRICK_W / 2 : 0;
            for (let col = -1; col < 4; col++) {
                const x = col * BRICK_W + shift, y = row * BRICK_H;
                const v = 30 + Math.round(rnd() * 9);
                t.fillStyle = `rgb(${v + 4}, ${v}, ${v - 3})`;
                t.fillRect(x + MORTAR / 2, y + MORTAR / 2, BRICK_W - MORTAR, BRICK_H - MORTAR);
                t.fillStyle = 'rgba(255, 245, 230, 0.035)'; // lit top edge
                t.fillRect(x + MORTAR / 2, y + MORTAR / 2, BRICK_W - MORTAR, 1);
            }
        }
        grillePattern = ctx.createPattern(tile, 'repeat');
        grillePattern.dpr = dpr;

        vignette = ctx.createRadialGradient(width / 2, height / 2, Math.min(width, height) * 0.25,
                                            width / 2, height / 2, Math.max(width, height) * 0.8);
        vignette.addColorStop(0, 'rgba(12, 11, 10, 0.10)');
        vignette.addColorStop(1, 'rgba(8, 7, 7, 0.80)');
    }

    function drawSprayHaze() {
        // A soft overspray behind each region, in rotating spray colours.
        if (!data || !data.megaclusters || !rangeX) return;
        const margin = 60;
        const scale = Math.min((width - margin * 2) / rangeX, (height - margin * 2) / rangeY) * zoom;
        data.megaclusters.forEach((m, i) => {
            const R = Math.max(40, extentOf(m) * scale * 1.15);
            const [sx, sy] = toScreen(m.center_x, m.center_y);
            if (sx + R < 0 || sx - R > width || sy + R < 0 || sy - R > height) return;
            const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, R);
            const c = SPRAY[i % SPRAY.length];
            g.addColorStop(0, `rgba(${c}, 0.15)`);
            g.addColorStop(0.6, `rgba(${c}, 0.06)`);
            g.addColorStop(1, `rgba(${c}, 0)`);
            ctx.fillStyle = g;
            ctx.fillRect(sx - R, sy - R, R * 2, R * 2);
        });
    }

    function drawBackground(time) {
        ctx.fillStyle = GROUND;
        ctx.fillRect(0, 0, width, height);
        if (grillePattern) {
            // Parallax: the wall moves at a fraction of the map's pan and
            // grows gently with zoom, so it feels behind the data.
            const k = Math.pow(zoom / MIN_ZOOM, 0.22);
            const m = new DOMMatrix()
                .translate(width / 2 + offsetX * 0.35, height / 2 + offsetY * 0.35)
                .scale(k / grillePattern.dpr);
            grillePattern.setTransform(m);
            ctx.fillStyle = grillePattern;
            ctx.fillRect(0, 0, width, height);
        }
        drawSprayHaze();
        ctx.fillStyle = vignette;
        ctx.fillRect(0, 0, width, height);
    }

    // --- Sound waves: each region emits slow concentric wavefronts from its
    // centre, out to its own extent. Regions at rest, clusters once zoomed.
    const WAVE_PERIOD = 9000;   // ms for a wavefront to travel out
    const WAVE_COUNT = 3;       // wavefronts in flight per source
    const waveExtent = new WeakMap();   // item -> radius in data units
    function extentOf(item) {
        let r = waveExtent.get(item);
        if (r == null) {
            r = 0;
            for (const [bx, by] of (item.boundary || []))
                r = Math.max(r, Math.hypot(bx - item.center_x, by - item.center_y));
            waveExtent.set(item, r);
        }
        return r;
    }

    function drawWaves(items, alpha, time, rgb) {
        if (alpha < 0.02 || !items.length) return;
        const margin = 60;
        const scale = Math.min((width - margin * 2) / rangeX, (height - margin * 2) / rangeY) * zoom;
        ctx.lineWidth = 1.4;
        items.forEach((item, idx) => {
            const R = extentOf(item) * scale;
            if (R < 6) return;
            const [sx, sy] = toScreen(item.center_x, item.center_y);
            if (sx + R < 0 || sx - R > width || sy + R < 0 || sy - R > height) return;
            // Stagger sources so the field breathes instead of pulsing in sync.
            const phase0 = (idx * 0.6180339) % 1;
            for (let w = 0; w < WAVE_COUNT; w++) {
                const f = REDUCED_MOTION
                    ? (w + 1) / (WAVE_COUNT + 0.5)
                    : ((time / WAVE_PERIOD) + phase0 + w / WAVE_COUNT) % 1;
                const r = R * (0.08 + 0.97 * f);
                // Fade in from the centre, out at the edge.
                const a = alpha * Math.min(1, f * 6) * Math.pow(1 - f, 1.4);
                if (a < 0.01) continue;
                ctx.beginPath();
                ctx.arc(sx, sy, r, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(${rgb}, ${a})`;
                ctx.stroke();
            }
        });
    }

    // Hover ping: a quick double ripple off the company under the cursor.
    let pingStart = 0, pingPoint = null;
    function drawPing(time) {
        if (!hoveredPoint || REDUCED_MOTION) return;
        if (pingPoint !== hoveredPoint) { pingPoint = hoveredPoint; pingStart = time; }
        const age = (time - pingStart) % 1600;
        const [sx, sy] = toScreen(hoveredPoint.x, hoveredPoint.y);
        const r0 = getRadius(hoveredPoint, zoom) * 1.4;
        for (const lag of [0, 260]) {
            const f = (age - lag) / 900;
            if (f <= 0 || f >= 1) continue;
            ctx.beginPath();
            ctx.arc(sx, sy, r0 + f * 26, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(255, 61, 139, ${0.8 * (1 - f)})`;
            ctx.lineWidth = 1.2;
            ctx.stroke();
        }
    }

    function init() {
        canvas = document.getElementById('canvas');
        ctx = canvas.getContext('2d');
        resize();
        resetBackground();
        window.addEventListener('resize', () => { resize(); resetBackground(); });

        canvas.addEventListener('mousedown', onMouseDown);
        canvas.addEventListener('mousemove', onMouseMove);
        canvas.addEventListener('mouseup', onMouseUp);
        canvas.addEventListener('mouseleave', onMouseUp);
        canvas.addEventListener('wheel', onWheel, { passive: false });

        canvas.addEventListener('touchstart', onTouchStart, { passive: false });
        canvas.addEventListener('touchmove', onTouchMove, { passive: false });
        canvas.addEventListener('touchend', onTouchEnd);

        document.getElementById('zoom-in').addEventListener('click', () => { targetZoom = Math.min(50, targetZoom * 1.3); });
        document.getElementById('zoom-out').addEventListener('click', () => { targetZoom = Math.max(MIN_ZOOM, targetZoom / 1.3); });
        document.getElementById('zoom-reset').addEventListener('click', () => { targetZoom = MIN_ZOOM; targetOffsetX = 0; targetOffsetY = 0; });
        const box = document.getElementById('search');
        box.addEventListener('input', (e) => { searchTerm = e.target.value.toLowerCase(); showSuggestions(); });
        box.addEventListener('focus', showSuggestions);
        box.addEventListener('blur', () => setTimeout(hideSuggestions, 120));
        box.addEventListener('keydown', (e) => {
            const items = [...document.querySelectorAll('#tag-suggest li[data-tag]')];
            if (!items.length || document.getElementById('tag-suggest').hidden) return;
            if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
                e.preventDefault();
                suggestIdx = (suggestIdx + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
                items.forEach((li, i) => li.setAttribute('aria-selected', i === suggestIdx ? 'true' : 'false'));
                items[suggestIdx].scrollIntoView({ block: 'nearest' });
            } else if (e.key === 'Enter' && suggestIdx >= 0) {
                e.preventDefault();
                pickTag(items[suggestIdx].dataset.tag);
            }
        });
        document.getElementById('tag-suggest').addEventListener('mousedown', (e) => {
            const li = e.target.closest('li[data-tag]');
            if (li) { e.preventDefault(); pickTag(li.dataset.tag); }
        });
        document.getElementById('tag-clear').addEventListener('click', () => setTag(null));
        // Esc: close the suggestions, then clear the text, then the tag; wherever the focus is.
        document.addEventListener('keydown', (e) => {
            if (e.key !== 'Escape') return;
            if (!document.getElementById('tag-suggest').hidden) { hideSuggestions(); return; }
            if (box.value || searchTerm) { box.value = ''; searchTerm = ''; box.blur(); return; }
            if (activeTag) setTag(null);
        });
        document.getElementById('mention-slider').addEventListener('input', (e) => {
            mentionThreshold = +e.target.value;
            document.getElementById('mention-val').textContent = e.target.value;
            updateFilterCount();
        });
        document.getElementById('score-slider').addEventListener('input', (e) => {
            scoreThreshold = +e.target.value;
            document.getElementById('score-val').textContent =
                scoreThreshold > 0 ? scoreThreshold.toFixed(2) : 'off';
            updateFilterCount();
        });

        document.getElementById('research-only').addEventListener('change', (e) => {
            researchOnly = e.target.checked;
            updateFilterCount();
        });

        loadData();
    }

    async function loadData() {
        const resp = await fetch('data.json');
        data = await resp.json();

        // Version + last-updated note — bump APP_VERSION on notable UX/pipeline changes.
        const APP_VERSION = 'v1.24';
        tagCounts = {};
        for (const p of data.points) for (const t of p.tags || []) tagCounts[t] = (tagCounts[t] || 0) + 1;
        // The research filter only appears once the map has research projects.
        document.getElementById('research-filter').hidden = !data.points.some(p => p.research);
        if (data.generated_at) {
            const d = new Date(data.generated_at);
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const yyyy = d.getFullYear();
            document.getElementById('last-updated').textContent =
                `${APP_VERSION}, data last updated ${mm}-${yyyy} · created by Dan Ledger`;
        } else {
            document.getElementById('last-updated').textContent =
                `${APP_VERSION} · created by Dan Ledger`;
        }

        minX = Infinity; maxX = -Infinity;
        minY = Infinity; maxY = -Infinity;
        for (const p of data.points) {
            minX = Math.min(minX, p.x);
            maxX = Math.max(maxX, p.x);
            minY = Math.min(minY, p.y);
            maxY = Math.max(maxY, p.y);
        }
        rangeX = maxX - minX || 1;
        rangeY = maxY - minY || 1;

        // Initialize nodes for D3 force simulation
        nodes = data.points.map(p => ({
            ...p,
            targetX: p.x,
            targetY: p.y,
            x: p.x + (Math.random() - 0.5) * 0.1,
            y: p.y + (Math.random() - 0.5) * 0.1,
        }));

        data.points = nodes;
        updateFilterCount();
        initSimulation();
        startRenderLoop();
    }

    function initSimulation() {
        const driftStrength = REDUCED_MOTION ? 0 : 0.00008;

        for (const node of nodes) {
            node.targetX = node.x;
            node.targetY = node.y;
        }

        simulation = d3.forceSimulation(nodes)
            .force('targetX', d3.forceX(d => d.targetX).strength(0.08))
            .force('targetY', d3.forceY(d => d.targetY).strength(0.08))
            .alphaDecay(0)
            .alphaTarget(0.005)
            .velocityDecay(0.7)
            .on('tick', () => {
                for (const node of nodes) {
                    node.vx += (Math.random() - 0.5) * driftStrength;
                    node.vy += (Math.random() - 0.5) * driftStrength;
                }
            });
    }

    function startRenderLoop() {
        function loop(time) {
            render(time);
            requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
    }

    function isPointVisible(point) {
        if (point.mention_count < mentionThreshold) return false;
        // Points without a score (shouldn't happen post-scoring, but old
        // data.json builds lack the field) are exempt rather than hidden.
        if (scoreThreshold > 0 && point.score != null && point.score < scoreThreshold) return false;
        if (researchOnly && !point.research) return false;
        return true;
    }

    // --- Tag search: suggestions match anywhere in a tag's name ---
    function tagLabel(t) { return t.replace(/_/g, ' ').toLowerCase(); }

    function hideSuggestions() {
        const ul = document.getElementById('tag-suggest');
        ul.hidden = true; suggestIdx = -1;
        document.getElementById('search').setAttribute('aria-expanded', 'false');
    }

    function showSuggestions() {
        const ul = document.getElementById('tag-suggest');
        const q = searchTerm.trim();
        if (!data || q.length < 2) { hideSuggestions(); return; }
        const info = data.tag_info || {};
        const hits = Object.keys(tagCounts)
            .filter(t => tagLabel(t).includes(q))
            .sort((a, b) => (tagLabel(a).startsWith(q) ? 0 : 1) - (tagLabel(b).startsWith(q) ? 0 : 1)
                            || tagCounts[b] - tagCounts[a])
            .slice(0, 8);
        if (!hits.length) { hideSuggestions(); return; }
        const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        ul.innerHTML = '<li class="head" aria-hidden="true">Tags</li>' + hits.map(t => {
            const label = tagLabel(t), i = label.indexOf(q);
            const marked = esc(label.slice(0, i)) + '<mark>' + esc(label.slice(i, i + q.length)) + '</mark>' + esc(label.slice(i + q.length));
            return `<li role="option" aria-selected="false" data-tag="${esc(t)}"><span class="t">${marked}</span>`
                 + `<span class="n">${tagCounts[t]}</span>`
                 + (info[t] ? `<span class="d">${esc(info[t])}</span>` : '') + '</li>';
        }).join('');
        suggestIdx = -1;
        ul.hidden = false;
        document.getElementById('search').setAttribute('aria-expanded', 'true');
    }

    function pickTag(t) {
        const box = document.getElementById('search');
        box.value = ''; searchTerm = '';
        hideSuggestions();
        setTag(t);
    }

    function setTag(t) {
        activeTag = t;
        const chip = document.getElementById('tag-chip');
        if (t) {
            chip.querySelector('.label').innerHTML =
                `Tag: <b></b> \u00b7 ${(tagCounts[t] || 0).toLocaleString()} companies`;
            chip.querySelector('.label b').textContent = tagLabel(t);
            chip.title = (data.tag_info || {})[t] || '';
        }
        chip.hidden = !t;
    }

    function updateFilterCount() {
        if (!data) return;
        const shown = data.points.filter(isPointVisible).length;
        document.getElementById('filter-count').textContent =
            shown === data.points.length
                ? `${data.points.length.toLocaleString()} entities`
                : `${shown.toLocaleString()} of ${data.points.length.toLocaleString()} entities`;
    }

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width * devicePixelRatio;
        canvas.height = height * devicePixelRatio;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    }

    function toScreen(px, py) {
        const margin = 60;
        const scale = Math.min((width - margin * 2) / rangeX, (height - margin * 2) / rangeY);
        const cx = width / 2, cy = height / 2;
        const mx = (minX + maxX) / 2, my = (minY + maxY) / 2;
        return [cx + (px - mx) * scale * zoom + offsetX, cy + (py - my) * scale * zoom + offsetY];
    }

    function fromScreen(sx, sy) {
        const margin = 60;
        const scale = Math.min((width - margin * 2) / rangeX, (height - margin * 2) / rangeY);
        const cx = width / 2, cy = height / 2;
        const mx = (minX + maxX) / 2, my = (minY + maxY) / 2;
        return [(sx - cx - offsetX) / (scale * zoom) + mx, (sy - cy - offsetY) / (scale * zoom) + my];
    }

    function render(time = 0) {
        // Ease camera state toward targets — gives zoom/wheel/pinch that
        // floating-through-space feel instead of a hard snap.
        // Delta-time-aware so 60Hz and 120Hz displays feel the same.
        const dt = lastFrameTime ? Math.min((time - lastFrameTime) / 1000, 0.1) : 1 / 60;
        lastFrameTime = time;
        const ease = 1 - Math.exp(-CAMERA_EASE_RATE * dt);
        zoom    += (targetZoom    - zoom)    * ease;
        offsetX += (targetOffsetX - offsetX) * ease;
        offsetY += (targetOffsetY - offsetY) * ease;

        drawBackground(time);

        if (!data) return;

        // Zoom thresholds for label transitions. Cluster labels are visible
        // from the initial zoom (MIN_ZOOM 1.2 > 1.0) — the map reads as
        // labeled territories at rest, not on zoom-in.
        const clusterLabelFadeIn = 1.0;   // cluster names start appearing
        const companyLabelStart = 7.5;    // company names start appearing
        // (descriptions under the names fade in from DESC_START, see below)
        // After companyLabelStart, cluster labels transition to background layer

        // --- Word-wrap cluster name into lines targeting a squarish shape ---
        function wrapClusterName(name, fontSize, font) {
            ctx.font = font;
            const words = name.split(' ');
            if (words.length <= 2) return [name];

            // Try different line counts and pick the most square result
            let bestLines = [name];
            let bestRatio = Infinity;
            for (let nLines = 2; nLines <= Math.min(3, words.length); nLines++) {
                const lines = [];
                const wordsPerLine = Math.ceil(words.length / nLines);
                for (let i = 0; i < words.length; i += wordsPerLine) {
                    lines.push(words.slice(i, i + wordsPerLine).join(' '));
                }
                const maxW = Math.max(...lines.map(l => ctx.measureText(l).width));
                const totalH = lines.length * fontSize * 1.3;
                const ratio = Math.abs(Math.log(maxW / totalH));
                if (ratio < bestRatio) {
                    bestRatio = ratio;
                    bestLines = lines;
                }
            }
            return bestLines;
        }

        // --- Compute nudged label positions to avoid overlap ---
        // Works for any list of {name, center_x, center_y}; checkMembers
        // hides cluster labels whose members are all filtered out.
        function computeLabelPositions(items, fontSize, checkMembers, font) {
            ctx.font = font;
            const lineHeight = fontSize * 1.3;
            const labels = [];
            for (const cluster of items) {
                if (checkMembers) {
                    const hasVisible = data.points.some(p => p.cluster_id === cluster.id && isPointVisible(p));
                    if (!hasVisible) continue;
                }
                const [sx, sy] = toScreen(cluster.center_x, cluster.center_y);
                if (sx < -400 || sx > width + 400 || sy < -400 || sy > height + 400) continue;
                const lines = wrapClusterName(cluster.name, fontSize, font);
                const maxW = Math.max(...lines.map(l => ctx.measureText(l).width));
                const totalH = lines.length * lineHeight;
                labels.push({
                    cluster,
                    lines,
                    x: sx,
                    y: sy,
                    hw: maxW / 2 + 6,
                    hh: totalH / 2 + 4,
                    lineHeight,
                });
            }
            // Iterative relaxation — push overlapping labels apart
            for (let iter = 0; iter < 8; iter++) {
                for (let i = 0; i < labels.length; i++) {
                    for (let j = i + 1; j < labels.length; j++) {
                        const a = labels[i], b = labels[j];
                        const ox = (a.hw + b.hw) - Math.abs(a.x - b.x);
                        const oy = (a.hh + b.hh) - Math.abs(a.y - b.y);
                        if (ox > 0 && oy > 0) {
                            if (oy < ox) {
                                const push = oy * 0.52;
                                if (a.y < b.y) { a.y -= push; b.y += push; }
                                else { a.y += push; b.y -= push; }
                            } else {
                                const push = ox * 0.52;
                                if (a.x < b.x) { a.x -= push; b.x += push; }
                                else { a.x += push; b.x -= push; }
                            }
                        }
                    }
                }
            }
            return labels;
        }

        // --- Draw multi-line centered text over a soft dark aura.
        // A single outline stroke gets swamped where dots pile up, so the halo
        // is three widening passes at falling alpha: the glyphs carry their own
        // pool of shadow that dims whatever is under them, without the boxy
        // look of a drawn label plate. haloRGB is a bare "r, g, b" triplet.
        const HALO_PASSES = [[2.6, 0.22], [1.7, 0.45], [1.0, 1.0]];

        function drawClusterLabel(lbl, color, haloRGB, haloAlpha, haloWidth, drop) {
            const startY = lbl.y - (lbl.lines.length - 1) * lbl.lineHeight / 2;
            ctx.lineJoin = 'round';
            for (let i = 0; i < lbl.lines.length; i++) {
                const ly = startY + i * lbl.lineHeight;
                if (haloRGB) {
                    for (const [wScale, aScale] of HALO_PASSES) {
                        ctx.strokeStyle = `rgba(${haloRGB}, ${haloAlpha * aScale})`;
                        ctx.lineWidth = haloWidth * wScale;
                        ctx.strokeText(lbl.lines[i], lbl.x, ly);
                    }
                }
                if (drop) {     // graffiti offset: a second colour behind the letters
                    const d = Math.max(1.5, haloWidth * 0.55);
                    ctx.fillStyle = drop;
                    ctx.fillText(lbl.lines[i], lbl.x + d, ly + d);
                }
                ctx.fillStyle = color;
                ctx.fillText(lbl.lines[i], lbl.x, ly);
            }
        }

        // --- Cluster labels: background layer (large, dim — deep-zoom wayfinding) ---
        const bgPhase = zoom > companyLabelStart ? Math.min(1, (zoom - companyLabelStart) / 3.0) : 0;
        if (zoom > clusterLabelFadeIn && bgPhase > 0) {
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const bgAlpha = 0.2 * (1 - bgPhase * 0.4);
            const fontSize = Math.min(80, 18 * Math.sqrt(zoom / 2));
            const font = `400 ${fontSize}px ${FONT_SERIF}`;
            const labels = computeLabelPositions(data.clusters, fontSize, true, font);
            ctx.font = font;

            for (const lbl of labels) {
                drawClusterLabel(lbl, `rgba(243, 238, 228, ${bgAlpha * 0.8})`);
            }
        }

        // --- Sound waves under the dots: regions at rest, clusters zoomed in ---
        {
            const cp = Math.min(1, Math.max(0, (zoom - 1.9) / 1.3));
            const fade = zoom > companyLabelStart ? Math.max(0.35, 1 - (zoom - companyLabelStart) / 6) : 1;
            drawWaves(data.megaclusters || [], 0.5 * (1 - cp) * fade, time, '45, 226, 230');
            drawWaves(data.clusters, 0.4 * cp * fade, time, '45, 226, 230');
        }

        // --- Entity nodes ---
        const nameRects = [], descQueue = [];
        for (const point of data.points) {
            if (!isPointVisible(point)) continue;

            const [sx, sy] = toScreen(point.x, point.y);
            if (sx < -80 || sx > width + 80 || sy < -80 || sy > height + 80) continue;

            const isSearchActive = searchTerm.length > 0 || activeTag !== null;
            const isSearchMatch = isSearchActive
                && (!activeTag || (point.tags || []).includes(activeTag))
                && (!searchTerm || point.name.toLowerCase().includes(searchTerm)
                    || (!activeTag && (point.tags || []).some(t => tagLabel(t).includes(searchTerm))));
            const isHovered = hoveredPoint === point;

            let radius = getRadius(point, zoom);
            // Cool-tinted and translucent rather than pure white: at full
            // luminance the dot field out-shouts every label drawn over it.
            // The blue cast also sits opposite the amber labels on the wheel,
            // so the two separate by hue as well as brightness.
            let alpha = 0.52;
            let emphasis = false;

            if (isSearchActive && !isSearchMatch) alpha = 0.06;
            if (isSearchMatch) { radius *= 1.5; alpha = 1; emphasis = true; }
            if (isHovered) { radius *= 1.4; alpha = 1; emphasis = true; }

            // Soft outer bloom under a brighter core reads as a lit node
            // instead of a flat disc. Skipped on the smallest dots, where it
            // would just smear the field into fog.
            if (radius > 2.2 && alpha > 0.2) {
                ctx.beginPath();
                ctx.arc(sx, sy, radius * 1.7, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 61, 139, ${alpha * (emphasis ? 0.30 : 0.10)})`;
                ctx.fill();
            }

            ctx.beginPath();
            ctx.arc(sx, sy, radius, 0, Math.PI * 2);
            ctx.fillStyle = emphasis
                ? `rgba(255, 255, 255, ${alpha})`
                : `rgba(243, 238, 228, ${alpha})`;
            ctx.fill();

            if (emphasis) {
                ctx.strokeStyle = 'rgba(45, 226, 230, 0.95)';
                ctx.lineWidth = 1.5;
                ctx.stroke();
            }

            // A lab's research project (not a product line): an open ring around the dot.
            if (point.research && alpha > 0.2) {
                ctx.beginPath();
                ctx.arc(sx, sy, radius + 2.5, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(255, 210, 63, ${Math.min(1, alpha + 0.25)})`;
                ctx.lineWidth = 1.4;
                ctx.stroke();
            }

            // Company name labels — appear as we zoom past cluster labels
            // Slow ramp: company names drift in over ~4-5 zoom units while the
            // cluster names are fading to the background layer, so the two
            // label generations crossfade instead of clashing.
            const companyAlpha = zoom > companyLabelStart ? Math.min(0.85, (zoom - companyLabelStart) * 0.18) : 0;

            const shouldLabel = (companyAlpha > 0 && point.mention_count >= 2) ||
                                (zoom > 5 && point.mention_count >= 1) ||
                                isSearchMatch || isHovered;

            if (shouldLabel && alpha > 0.2) {
                // Condensed type runs small: 12px at first appearance, up to 17px.
                const fs = Math.max(12, Math.min(17, 13 * Math.sqrt(zoom / 4)));
                ctx.font = `500 ${fs}px ${FONT_SANS}`;
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                const la = isHovered || isSearchMatch ? 0.95 : companyAlpha;
                // Same trick as the cluster labels, one pass: a dark rim so the
                // name survives passing over a neighbouring dot.
                ctx.lineJoin = 'round';
                ctx.lineWidth = Math.max(2.4, fs * 0.22);
                ctx.strokeStyle = `rgba(20, 18, 17, ${la * 0.8})`;
                ctx.strokeText(point.name, sx + radius + 4, sy);
                ctx.globalAlpha = la;
                ctx.fillStyle = '#f3eee4';
                ctx.fillText(point.name, sx + radius + 4, sy);
                ctx.globalAlpha = 1;

                // Deepest zoom: queue the description; it is drawn after every
                // name is placed, only where it collides with nothing.
                const lx = sx + radius + 4;
                nameRects.push([lx - 2, sy - fs * 0.6, lx + ctx.measureText(point.name).width + 2, sy + fs * 0.6, point]);
                const da = zoom > DESC_START ? Math.min(1, (zoom - DESC_START) / 4) * la : 0;
                if (da > 0.05 && point.description && sx > -300 && sx < width && sy > -60 && sy < height + 20) {
                    descQueue.push({ point, lx, sy, fs, da, first: isHovered || isSearchMatch });
                }
            }
        }

        // Descriptions under names (deepest zoom): hovered/searched first, then
        // the most-covered companies. One blocked below its name (by a name or
        // an already drawn description) goes above it instead; blocked both
        // ways, it is left out (hover still shows it).
        if (descQueue.length) {
            descQueue.sort((a, b) => (b.first - a.first) || (b.point.mention_count - a.point.mention_count));
            const placed = [];
            const hits = (r, list, self) => list.some(o => o[4] !== self && r[0] < o[2] && r[2] > o[0] && r[1] < o[3] && r[3] > o[1]);
            for (const q of descQueue) {
                const dfs = Math.max(11, q.fs * 0.74);
                ctx.font = `400 ${dfs}px ${FONT_SANS}`;
                const lines = descLines(q.point, dfs);
                const w = Math.max(...lines.map(l => ctx.measureText(l).width));
                const h = lines.length * dfs * 1.22 + 2;
                // Under the name first; if that is blocked, above it.
                const below = q.sy + q.fs * 0.62, above = q.sy - q.fs * 0.62 - h;
                const rectAt = t => [q.lx - 2, t, q.lx + w + 2, t + h, q.point];
                const free = r => !hits(r, nameRects, q.point) && !hits(r, placed, null);
                let top = below;
                if (!q.first && !free(rectAt(below))) {
                    if (!free(rectAt(above))) continue;
                    top = above;
                }
                placed.push(rectAt(top));
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                ctx.lineJoin = 'round';
                ctx.lineWidth = Math.max(2.2, dfs * 0.22);
                ctx.strokeStyle = `rgba(20, 18, 17, ${q.da * 0.8})`;
                ctx.fillStyle = `rgba(214, 205, 189, ${q.da})`;
                let ly = top + dfs * 0.75;
                for (const line of lines) {
                    ctx.strokeText(line, q.lx, ly);
                    ctx.fillText(line, q.lx, ly);
                    ly += dfs * 1.22;
                }
            }
        }

        // --- Semantic zoom: mega-regions at rest crossfade into clusters,
        // which later crossfade into company names (bgPhase above).
        const clusterPhase = Math.min(1, Math.max(0, (zoom - 1.9) / 1.3));
        const megaAlpha = 1 - clusterPhase;
        const megas = data.megaclusters || [];

        function strokeHull(boundary) {
            if (!boundary || boundary.length < 3) return;
            ctx.beginPath();
            for (let i = 0; i < boundary.length; i++) {
                const [bx, by] = toScreen(boundary[i][0], boundary[i][1]);
                if (i === 0) ctx.moveTo(bx, by);
                else ctx.lineTo(bx, by);
            }
            ctx.closePath();
            ctx.stroke();
        }

        // --- Boundaries: marching-ants dashed hulls (over the dots).
        // Constant screen-space dash + steady drift keeps them visually
        // separate from the static circuit art behind them.
        drawPing(time);
        ctx.lineJoin = 'round';
        if (megaAlpha > 0.02 && megas.length) {
            ctx.strokeStyle = `rgba(243, 238, 228, ${0.26 * megaAlpha})`;
            ctx.lineWidth = 1;
            for (const m of megas) strokeHull(m.boundary);
        }
        if (clusterPhase > 0.02) {
            ctx.strokeStyle = `rgba(243, 238, 228, ${0.22 * clusterPhase})`;
            ctx.lineWidth = 0.9;
            for (const cluster of data.clusters) strokeHull(cluster.boundary);
        }

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        // --- Mega-region labels: the zoomed-out generation ---
        if (megaAlpha > 0.01 && megas.length) {
            const fontSize = Math.min(34, 21 * Math.sqrt(zoom / 1.2));
            const font = `400 ${fontSize}px ${FONT_SERIF}`;
            const labels = computeLabelPositions(megas, fontSize, false, font);
            ctx.font = font;
            const a = 0.95 * megaAlpha;
            const haloW = Math.max(2.2, fontSize * 0.13);
            for (const lbl of labels) {
                drawClusterLabel(lbl, `rgba(255, 210, 63, ${a})`,
                                 '20, 18, 17', a * 0.85, haloW, `rgba(255, 61, 139, ${a})`);
            }
        }

        // --- Cluster labels: foreground layer, on top of the dots ---
        if (clusterPhase > 0.01) {
            const fgAlpha = Math.max(0, clusterPhase * (1 - bgPhase) * 0.85);

            if (fgAlpha > 0.01) {
                // Small when many labels are visible, growing as zoom brings
                // fewer clusters on screen.
                const fontSize = Math.max(9, Math.min(28, 13 * Math.sqrt(zoom / 2)));
                const font = `600 ${fontSize * 1.12}px ${FONT_SANS}`;
                const labels = computeLabelPositions(data.clusters, fontSize, true, font);
                ctx.font = font;

                const haloW = Math.max(1.8, fontSize * 0.13);
                for (const lbl of labels) {
                    // Amber fill over a soft dark aura: bright against the
                    // board, and the aura punches a hole in the dot field.
                    drawClusterLabel(lbl, `rgba(243, 238, 228, ${fgAlpha})`,
                                     '20, 18, 17', fgAlpha * 0.85, haloW);
                }
            }
        }
    }

    function findPointAt(mx, my) {
        if (!data) return null;
        let closest = null, closestDist = Infinity;
        for (const point of data.points) {
            if (!isPointVisible(point)) continue;
            const [sx, sy] = toScreen(point.x, point.y);
            const r = getRadius(point, zoom);
            const dist = Math.sqrt((mx - sx) ** 2 + (my - sy) ** 2);
            if (dist < r + 4 && dist < closestDist) {
                closest = point;
                closestDist = dist;
            }
        }
        return closest;
    }

    function showTooltip(point, mx, my) {
        const tooltip = document.getElementById('tooltip');
        tooltip.querySelector('.name').textContent = point.name;
        let meta = point.research ? `Research project \u00b7 ${point.category || ''}` : `${point.category || ''}`;
        if (point.type) meta += ` \u00b7 ${point.type}`;
        if (point.location) meta += ` \u00b7 ${point.location}`;
        meta += ` \u00b7 ${point.mention_count} mention${point.mention_count !== 1 ? 's' : ''}`;
        if (point.score != null) meta += ` \u00b7 relevance ${point.score.toFixed(2)}`;
        tooltip.querySelector('.meta').textContent = meta;
        const tags = point.tags || [];
        tooltip.querySelector('.tags').textContent = tags.length ? tags.map(t => t.replace(/_/g, ' ')).join(', ') : '';
        tooltip.querySelector('.desc').textContent = point.description || '';

        let tx = mx + 16, ty = my - 10;
        if (tx + 360 > width) tx = mx - 370;
        if (ty + 150 > height) ty = height - 160;
        if (ty < 10) ty = 10;
        tooltip.style.left = tx + 'px';
        tooltip.style.top = ty + 'px';
        tooltip.style.display = 'block';
    }

    function hideTooltip() {
        document.getElementById('tooltip').style.display = 'none';
    }

    // --- Deep-hover panel: bullets + connector line ---
    const DEEP_HOVER_DELAY = 2500; // ms
    let deepHoverTimer = null;
    let deepHoverPoint = null;
    const bulletsCache = new Map(); // name -> { title, bullets[] }

    async function fetchBullets(point) {
        if (bulletsCache.has(point.name)) return bulletsCache.get(point.name);
        // Bullets are embedded on each point in data.json at build time —
        // no network call needed. This makes the viz fully static for
        // Vercel deployment.
        // Labelled lines ("Used in: cars") when the map has them; the bare
        // embedding lines read like sub-points of each other.
        const raw = (point.bullets_display || point.bullets || '').split('\n').filter(Boolean);
        const bullets = raw.map(line => line.replace(/^\s*\d+\.\s*/, '').trim()).filter(Boolean);
        if (!bullets.length) return null;
        // Profile attributes (type, scale, geography...): shown, never embedded.
        (point.profile || '').split('\n').map(s => s.trim()).filter(Boolean).forEach(s => bullets.push(s));
        const entry = { title: point.name, bullets };
        bulletsCache.set(point.name, entry);
        return entry;
    }

    function scheduleDeepHover(point) {
        cancelDeepHover();
        deepHoverTimer = setTimeout(() => { triggerDeepHover(point); }, DEEP_HOVER_DELAY);
    }

    function cancelDeepHover() {
        if (deepHoverTimer) { clearTimeout(deepHoverTimer); deepHoverTimer = null; }
    }

    async function triggerDeepHover(point) {
        if (hoveredPoint !== point) return;
        const data = await fetchBullets(point);
        if (!data || hoveredPoint !== point) return;
        deepHoverPoint = point;
        showDeepPanel(data);
    }

    let typewriterToken = 0;  // incremented on each show to cancel prior typer

    function showDeepPanel(data) {
        const panel = document.getElementById('deep-panel');
        panel.querySelector('.title').textContent = data.title;
        const ul = panel.querySelector('ul');
        ul.innerHTML = '';

        // Kick off typewriter — cancellable via token.
        const token = ++typewriterToken;
        runTypewriter(ul, panel, data.bullets, token);

        const tooltip = document.getElementById('tooltip');
        const tRect = tooltip.getBoundingClientRect();

        // Choose the side of the viewport with more room.
        const roomRight = width - tRect.right;
        const roomLeft  = tRect.left;
        const panelW = 420;
        const gap = 60;

        let panelLeft, panelTop;
        let anchor;  // which edge of the tooltip we leave from
        if (roomRight >= roomLeft) {
            panelLeft = Math.min(width - panelW - 16, tRect.right + gap);
            anchor = { x: tRect.right, y: tRect.top + tRect.height / 2, side: 'right' };
        } else {
            panelLeft = Math.max(16, tRect.left - panelW - gap);
            anchor = { x: tRect.left, y: tRect.top + tRect.height / 2, side: 'left' };
        }
        // Use ~95% of vertical real estate: pin top at 2.5vh so max-height: 95vh
        // leaves matching 2.5vh gap at the bottom.
        panelTop = Math.round(height * 0.025);

        panel.style.left = panelLeft + 'px';
        panel.style.top = panelTop + 'px';
        panel.style.display = 'block';
        // Next frame: fade in + animate line
        requestAnimationFrame(() => {
            panel.classList.add('visible');
            const pRect = panel.getBoundingClientRect();
            const pAnchor = { x: anchor.side === 'right' ? pRect.left : pRect.right,
                              y: pRect.top + pRect.height / 2 };
            const line = document.getElementById('connector-line');
            line.setAttribute('x1', anchor.x);
            line.setAttribute('y1', anchor.y);
            line.setAttribute('x2', pAnchor.x);
            line.setAttribute('y2', pAnchor.y);
            const len = Math.hypot(pAnchor.x - anchor.x, pAnchor.y - anchor.y);
            line.setAttribute('stroke-dasharray', len);
            line.setAttribute('stroke-dashoffset', len);
            // Force reflow then animate
            line.getBoundingClientRect();
            line.style.transition = 'stroke-dashoffset 450ms ease-out';
            line.setAttribute('stroke-dashoffset', 0);
        });
    }

    function hideDeepPanel() {
        typewriterToken++;  // invalidate any in-flight typing
        deepHoverPoint = null;
        const panel = document.getElementById('deep-panel');
        panel.classList.remove('visible');
        panel.style.display = 'none';
        const line = document.getElementById('connector-line');
        line.style.transition = 'none';
        line.setAttribute('stroke-dashoffset', line.getAttribute('stroke-dasharray'));
    }

    // Old-school-modem typewriter: emit one char at a time across all bullets,
    // scrolling the panel to keep the live cursor in view.
    async function runTypewriter(ul, panel, bullets, token) {
        const CHAR_MS = 6;            // ~165 cps — brisk but still typed
        const PAUSE_BETWEEN = 80;     // ms pause between bullets
        const END_PAUSE = 250;        // longer pause before the END. line
        // Live cursor element — moves from line to line as we type
        const cursor = document.createElement('span');
        cursor.className = 'cursor';
        cursor.innerHTML = '&nbsp;';

        const lines = [...bullets, 'END.'];
        for (let idx = 0; idx < lines.length; idx++) {
            if (token !== typewriterToken) return;
            const b = lines[idx];
            const li = document.createElement('li');
            ul.appendChild(li);
            li.appendChild(cursor);
            for (let i = 0; i < b.length; i++) {
                if (token !== typewriterToken) return;
                cursor.insertAdjacentText('beforebegin', b[i]);
                panel.scrollTop = panel.scrollHeight;
                await new Promise(r => setTimeout(r, CHAR_MS));
            }
            // Longer dramatic pause before the final END. line
            const pause = (idx === lines.length - 2) ? END_PAUSE : PAUSE_BETWEEN;
            await new Promise(r => setTimeout(r, pause));
        }
        if (token === typewriterToken) cursor.remove();
    }

    // --- Event handlers ---
    function onMouseDown(e) {
        dragging = true;
        dragStartX = e.clientX;
        dragStartY = e.clientY;
    }

    function onMouseMove(e) {
        if (dragging) {
            const dx = e.clientX - dragStartX;
            const dy = e.clientY - dragStartY;
            // Drag tracks the cursor instantly — otherwise panning feels broken.
            offsetX += dx;  offsetY += dy;
            targetOffsetX += dx;  targetOffsetY += dy;
            dragStartX = e.clientX;
            dragStartY = e.clientY;
            hideTooltip();
            cancelDeepHover();
            hideDeepPanel();
            return;
        }
        const point = findPointAt(e.clientX, e.clientY);
        const changed = point !== hoveredPoint;
        if (changed) {
            hoveredPoint = point;
            if (point) for (const sp of document.querySelectorAll('.speaker')) {
                sp.classList.remove('thump'); void sp.offsetWidth; sp.classList.add('thump');
            }
            cancelDeepHover();
            if (deepHoverPoint && deepHoverPoint !== point) hideDeepPanel();
            if (point) scheduleDeepHover(point);
        }
        if (point) {
            showTooltip(point, e.clientX, e.clientY);
            canvas.style.cursor = 'pointer';
        } else {
            hideTooltip();
            hideDeepPanel();
            canvas.style.cursor = 'grab';
        }
    }

    function onMouseUp() { dragging = false; }

    function onWheel(e) {
        e.preventDefault();
        // Gentler per-tick factor; the smoothing interpolation eases the
        // change in over several frames so it feels like drifting.
        const factor = e.deltaY > 0 ? 0.94 : 1.06;
        const mx = e.clientX, my = e.clientY;
        const [px, py] = fromScreen(mx, my);  // world coords under cursor
        targetZoom = Math.max(MIN_ZOOM, Math.min(50, targetZoom * factor));
        // Set target offset so the cursor's world point lands at (mx, my)
        // once zoom settles, keeping zoom anchored to the cursor.
        const margin = 60;
        const scale = Math.min((width - margin * 2) / rangeX, (height - margin * 2) / rangeY);
        const cx = width / 2, cy = height / 2;
        const mxData = (minX + maxX) / 2, myData = (minY + maxY) / 2;
        targetOffsetX = mx - cx - (px - mxData) * scale * targetZoom;
        targetOffsetY = my - cy - (py - myData) * scale * targetZoom;
    }

    let lastTouchDist = 0;
    function onTouchStart(e) {
        if (e.touches.length === 1) {
            dragging = true;
            dragStartX = e.touches[0].clientX;
            dragStartY = e.touches[0].clientY;
        } else if (e.touches.length === 2) {
            lastTouchDist = Math.hypot(
                e.touches[0].clientX - e.touches[1].clientX,
                e.touches[0].clientY - e.touches[1].clientY
            );
        }
        e.preventDefault();
    }
    function onTouchMove(e) {
        if (e.touches.length === 1 && dragging) {
            const dx = e.touches[0].clientX - dragStartX;
            const dy = e.touches[0].clientY - dragStartY;
            offsetX += dx;  offsetY += dy;
            targetOffsetX += dx;  targetOffsetY += dy;
            dragStartX = e.touches[0].clientX;
            dragStartY = e.touches[0].clientY;
        } else if (e.touches.length === 2) {
            const dist = Math.hypot(
                e.touches[0].clientX - e.touches[1].clientX,
                e.touches[0].clientY - e.touches[1].clientY
            );
            if (lastTouchDist > 0) {
                targetZoom *= dist / lastTouchDist;
                targetZoom = Math.max(MIN_ZOOM, Math.min(50, targetZoom));
            }
            lastTouchDist = dist;
        }
        e.preventDefault();
    }
    function onTouchEnd() { dragging = false; lastTouchDist = 0; }

    init();
    </script>
</body>
</html>
